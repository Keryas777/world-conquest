<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>World Conquest · C4.20 Angle × Distance</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#f8fafc}.wrap{position:absolute;inset:0;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));background:#e5e7eb;color:#111827}.panel{background:#0f172a;color:#f8fafc;border-radius:18px;padding:13px 15px}.panel h1{margin:0 0 5px;font-size:18px}.sub{color:#cbd5e1;font-size:12px;line-height:1.4}.chart{position:absolute;left:14px;right:14px;top:155px;bottom:100px;background:#fff;border-radius:18px;overflow:hidden}.chart svg{width:100%;height:100%;display:block}.axis{stroke:#475569;stroke-width:1.5}.grid{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 4}.pt{fill:#fb7185;stroke:#111827;stroke-width:1.5}.near{fill:#fde047}.lbl{font:700 12px system-ui;fill:#111827}.tick{font:11px system-ui;fill:#475569}.caption{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#0f172a;color:#f8fafc;border-radius:16px;padding:10px 13px;font-size:12px;line-height:1.45}</style></head><body><div class="wrap"><div class="panel"><h1>WORLD CONQUEST · C4.20 ANGLE × DISTANCE</h1><div class="sub" id="summary">Chargement…</div></div><div class="chart"><svg id="chart"></svg></div><div class="caption">Diagnostic uniquement — X = distance à la frontière BE–LU (échelle logarithmique) · Y = transversalité (0° parallèle → 90° perpendiculaire). Aucun seuil, aucun score combiné, aucune surface modifiée.</div></div><script>
(async()=>{const data=await fetch('./c4-boundary-node-chain-lab.json',{cache:'no-store'}).then(r=>r.json()),cur=data.pairs[0],NS='http://www.w3.org/2000/svg',svg=document.getElementById('chart');
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)return{d:(p[0]-a[0])**2+(p[1]-a[1])**2,a,b};let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l;t=Math.max(0,Math.min(1,t));const x=a[0]+t*dx,y=a[1]+t*dy;return{d:(p[0]-x)**2+(p[1]-y)**2,a,b}}
function tangentAt(p){let best=null;for(const c of cur.components){const q=c.baseline.coordinates||[];for(let i=0;i<q.length-1;i++){const z=segDist(p,q[i],q[i+1]);if(!best||z.d<best.d)best=z}}return best?[best.b[0]-best.a[0],best.b[1]-best.a[1]]:null}
function edgeVector(d){const q=d.edge.coordinates||[],e=d.endpoint;if(q.length<2)return null;const ds=q.map((p,i)=>({i,d:(p[0]-e[0])**2+(p[1]-e[1])**2})).sort((a,b)=>a.d-b.d),i=ds[0].i,j=i===0?1:i===q.length-1?q.length-2:ds[1].i;return[q[j][0]-q[i][0],q[j][1]-q[i][1]]}
function angle(d){const a=edgeVector(d),b=tangentAt(d.nearestBorderPoint);if(!a||!b)return 0;const na=Math.hypot(...a),nb=Math.hypot(...b);if(!na||!nb)return 0;const c=Math.min(1,Math.max(-1,Math.abs((a[0]*b[0]+a[1]*b[1])/(na*nb))));return Math.acos(c)*180/Math.PI}
const ds=(cur.endpointDiagnostics||[]).map((d,i)=>({...d,source:i+1,angle:angle(d)}));const W=760,H=820,L=70,R=28,T=35,B=70;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const dmin=Math.max(1,Math.min(...ds.map(d=>d.distanceMeters))),dmax=Math.max(...ds.map(d=>d.distanceMeters)),lo=Math.log10(dmin),hi=Math.log10(dmax);const X=d=>L+(Math.log10(Math.max(1,d.distanceMeters))-lo)/(hi-lo)*(W-L-R),Y=d=>H-B-d.angle/90*(H-T-B);function line(x1,y1,x2,y2,cls){const e=document.createElementNS(NS,'line');[['x1',x1],['y1',y1],['x2',x2],['y2',y2],['class',cls]].forEach(a=>e.setAttribute(a[0],a[1]));svg.appendChild(e)}function text(x,y,s,cls,anchor='middle'){const e=document.createElementNS(NS,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('class',cls);e.setAttribute('text-anchor',anchor);e.textContent=s;svg.appendChild(e)}
[0,15,30,45,60,75,90].forEach(a=>{const y=H-B-a/90*(H-T-B);line(L,y,W-R,y,'grid');text(L-10,y+4,a+'°','tick','end')});line(L,T,L,H-B,'axis');line(L,H-B,W-R,H-B,'axis');[10,100,1000,10000].filter(x=>x>=dmin&&x<=dmax).forEach(m=>{const x=L+(Math.log10(m)-lo)/(hi-lo)*(W-L-R);line(x,T,x,H-B,'grid');text(x,H-B+22,m>=1000?(m/1000)+' km':m+' m','tick')});text((L+W-R)/2,H-18,'distance à la frontière (log)','tick');const yl=text(18,(T+H-B)/2,'transversalité','tick');
ds.forEach((d,i)=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',X(d));c.setAttribute('cy',Y(d));c.setAttribute('r',8);c.setAttribute('class','pt'+(d.distanceMeters<1000&&d.angle>=45?' near':''));svg.appendChild(c);text(X(d)+11,Y(d)-10,String(i+1),'lbl','start')});const sorted=[...ds].sort((a,b)=>a.distanceMeters-b.distanceMeters);document.getElementById('summary').textContent=`BE–LU · ${ds.length} candidats · distances ${sorted[0].distanceMeters.toFixed(1)} m → ${sorted.at(-1).distanceMeters.toFixed(1)} m · angles ${Math.min(...ds.map(d=>d.angle)).toFixed(1)}° → ${Math.max(...ds.map(d=>d.angle)).toFixed(1)}°`;})().catch(e=>document.getElementById('summary').textContent='Erreur: '+e.message)</script></body></html>
