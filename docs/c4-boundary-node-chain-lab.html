<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>World Conquest · C4 Boundary Node Chain</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111827; color:#f8fafc; }
    #map { position:absolute; inset:0; background:#dce3e8; touch-action:none; }
    svg { width:100%; height:100%; display:block; }
    .panel { position:absolute; left:14px; right:14px; top:calc(14px + env(safe-area-inset-top)); padding:14px 16px; border-radius:18px; background:rgba(15,23,42,.92); box-shadow:0 8px 30px rgba(0,0,0,.28); z-index:2; }
    h1 { margin:0 0 4px; font-size:18px; letter-spacing:.03em; }
    .sub { color:#cbd5e1; font-size:13px; line-height:1.35; }
    .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
    button { border:1px solid #475569; background:#1e293b; color:#f8fafc; border-radius:10px; padding:8px 10px; font-weight:700; }
    button.active { background:#f8fafc; color:#0f172a; }
    .legend { position:absolute; left:14px; bottom:calc(14px + env(safe-area-inset-bottom)); padding:10px 12px; border-radius:14px; background:rgba(15,23,42,.9); font-size:12px; line-height:1.7; z-index:2; }
    .sw { display:inline-block; width:18px; height:4px; vertical-align:middle; margin-right:7px; border-radius:4px; }
    .node { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; margin-right:10px; background:#fde047; border:2px solid #111827; }
    .baseline { fill:none; stroke:#64748b; stroke-width:2.2; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; }
    .c4 { fill:none; stroke:#ef4444; stroke-width:3.2; vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; }
    .candidate { fill:#fde047; stroke:#111827; stroke-width:1.4; vector-effect:non-scaling-stroke; }
    .endpoint { fill:#f97316; }
  </style>
</head>
<body>
  <div id="map"><svg id="svg"><g id="viewport"></g></svg></div>
  <div class="panel">
    <h1>WORLD CONQUEST · C4 FRONTIER NODE CHAIN</h1>
    <div class="sub" id="summary">Chargement…</div>
    <div class="controls" id="pairs"></div>
  </div>
  <div class="legend">
    <div><span class="sw" style="background:#64748b"></span>frontière réelle actuelle</div>
    <div><span class="sw" style="background:#ef4444"></span>C4 · segments droits entre nœuds</div>
    <div><span class="node"></span>intersection Voronoï / frontière</div>
  </div>
<script>
(async()=>{
  const data = await fetch('./c4-boundary-node-chain-lab.json',{cache:'no-store'}).then(r=>r.json());
  const svg=document.getElementById('svg'), viewport=document.getElementById('viewport'), controls=document.getElementById('pairs');
  const NS='http://www.w3.org/2000/svg';
  let current=data.pairs[0], transform={x:0,y:0,k:1}, drag=null;
  const all=[];
  data.pairs.forEach(p=>p.components.forEach(c=>c.baseline.coordinates.forEach(pt=>all.push(pt))));
  const minX=Math.min(...all.map(p=>p[0])), maxX=Math.max(...all.map(p=>p[0])), minY=Math.min(...all.map(p=>p[1])), maxY=Math.max(...all.map(p=>p[1]));
  const pad=.35; svg.setAttribute('viewBox',`${minX-pad} ${-(maxY+pad)} ${maxX-minX+2*pad} ${maxY-minY+2*pad}`);
  function path(coords){return coords.length?'M '+coords.map(p=>`${p[0]} ${-p[1]}`).join(' L '):'';}
  function draw(){
    viewport.innerHTML='';
    current.components.forEach(c=>{
      const a=document.createElementNS(NS,'path'); a.setAttribute('d',path(c.baseline.coordinates)); a.setAttribute('class','baseline'); viewport.appendChild(a);
      const b=document.createElementNS(NS,'path'); b.setAttribute('d',path(c.c4.coordinates)); b.setAttribute('class','c4'); viewport.appendChild(b);
    });
    current.nodes.forEach(n=>{const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',n.lon);c.setAttribute('cy',-n.lat);c.setAttribute('r',.025);c.setAttribute('class','candidate '+(n.source==='endpoint'?'endpoint':''));viewport.appendChild(c);});
    document.getElementById('summary').textContent=`${current.pair} · ${current.nodes.length} nœuds · ${current.components.length} composante(s) · expérimental, aucune surface de pays modifiée`;
  }
  data.pairs.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.pair;b.onclick=()=>{current=p;[...controls.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');draw();};if(i===0)b.classList.add('active');controls.appendChild(b);});
  let vb=svg.viewBox.baseVal;
  function zoomAt(f,cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const m=svg.getScreenCTM().inverse();const p=pt.matrixTransform(m);vb.x=p.x-(p.x-vb.x)/f;vb.y=p.y-(p.y-vb.y)/f;vb.width/=f;vb.height/=f;}
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY);},{passive:false});
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!drag)return;vb.x=drag.vx-(e.clientX-drag.x)*vb.width/svg.clientWidth;vb.y=drag.vy-(e.clientY-drag.y)*vb.height/svg.clientHeight;});
  svg.addEventListener('pointerup',()=>drag=null);
  draw();
})().catch(err=>document.getElementById('summary').textContent='Erreur: '+err.message);
</script>
</body>
</html>
