<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Conquest · C4.10 BE-LU Overlay</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#f8fafc}#map{position:absolute;inset:0;background:#dce3e8;touch-action:none}svg{width:100%;height:100%;display:block}.panel{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));padding:12px 14px;border-radius:18px;background:rgba(15,23,42,.95);z-index:2}h1{margin:0 0 4px;font-size:17px}.sub{color:#cbd5e1;font-size:12px;line-height:1.35}.legend{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:9px 11px;border-radius:14px;background:rgba(15,23,42,.9);font-size:11px;line-height:1.7;z-index:2}.cell{stroke:#f8fafc;stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.72}.BE{fill:#a78bfa}.LU{fill:#bef264}.baseline{fill:none;stroke:#475569;stroke-width:3.2;vector-effect:non-scaling-stroke}.internal{fill:none;stroke:#f59e0b;stroke-width:2.4;vector-effect:non-scaling-stroke}.connector{fill:none;stroke:#22d3ee;stroke-width:1.5;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}.candidate{fill:#fde047;stroke:#111827;stroke-width:1.4;vector-effect:non-scaling-stroke}.projection{fill:#22d3ee;stroke:#111827;stroke-width:1.3;vector-effect:non-scaling-stroke}.rank{font-size:10px;fill:#111827;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:2px}</style></head><body><div id="map"><svg id="svg"><g id="viewport"></g></svg></div><div class="panel"><h1>WORLD CONQUEST · C4.10 BE–LU OVERLAY</h1><div class="sub" id="summary">Chargement…</div></div><div class="legend">gris = frontière BE–LU · orange = arête Voronoï interne · jaune = extrémité candidate · cyan = projection/écart<br>Diagnostic uniquement — aucun calcul modifié</div><script>(async()=>{const[data,graph]=await Promise.all([fetch('./c4-boundary-node-chain-lab.json',{cache:'no-store'}).then(r=>r.json()),fetch('./voronoi-graph.json',{cache:'no-store'}).then(r=>r.json())]);const svg=document.getElementById('svg'),v=document.getElementById('viewport'),NS='http://www.w3.org/2000/svg',cur=data.pairs[0],cells=(graph.cells||[]).filter(c=>['BE','LU'].includes(c.ownerCode)&&c.geometry);let drag=null;function path(coords,cls){if(!coords||coords.length<2)return;const p=document.createElementNS(NS,'path');p.setAttribute('d','M '+coords.map(x=>x[0]+' '+(-x[1])).join(' L '));p.setAttribute('class',cls);v.appendChild(p)}function poly(rs){return rs.map(r=>'M '+r.map(p=>p[0]+' '+(-p[1])).join(' L ')+' Z').join(' ')}function gp(g){if(g.type==='Polygon')return poly(g.coordinates||[]);if(g.type==='MultiPolygon')return(g.coordinates||[]).map(poly).join(' ');return''}function bounds(){const p=[];cur.components.forEach(c=>c.baseline.coordinates.forEach(x=>p.push(x)));const xs=p.map(x=>x[0]),ys=p.map(x=>x[1]);let a=Math.min(...xs),b=Math.min(...ys),c=Math.max(...xs),d=Math.max(...ys),q=Math.max(.035,Math.max(c-a,d-b)*.16);return[a-q,b-q,c+q,d+q]}function touch(g,b){let p=[];(function w(x){if(!Array.isArray(x))return;if(typeof x[0]==='number'){p.push(x);return}x.forEach(w)})(g.coordinates);let x=p.map(z=>z[0]),y=p.map(z=>z[1]);return p.length&&!(Math.max(...x)<b[0]||Math.min(...x)>b[2]||Math.max(...y)<b[1]||Math.min(...y)>b[3])}function inside(x,b){return x[0]>=b[0]-.03&&x[0]<=b[2]+.03&&x[1]>=b[1]-.03&&x[1]<=b[3]+.03}function dot(x,cls,r){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x[0]);c.setAttribute('cy',-x[1]);c.setAttribute('r',r);c.setAttribute('class',cls);v.appendChild(c)}const b=bounds();svg.setAttribute('viewBox',b[0]+' '+(-b[3])+' '+(b[2]-b[0])+' '+(b[3]-b[1]));cells.filter(c=>touch(c.geometry,b)).forEach(c=>{let p=document.createElementNS(NS,'path');p.setAttribute('d',gp(c.geometry));p.setAttribute('class','cell '+c.ownerCode);v.appendChild(p)});cur.components.forEach(c=>path(c.baseline.coordinates,'baseline'));const shown=(cur.candidates||[]).filter(c=>inside(c.endpoint,b)&&inside(c.nearestBorder,b)).slice(0,12);shown.forEach(c=>{path(c.edge.coordinates,'internal');path([c.endpoint,c.nearestBorder],'connector');dot(c.endpoint,'candidate',.008);dot(c.nearestBorder,'projection',.006);let t=document.createElementNS(NS,'text');t.setAttribute('x',c.endpoint[0]+.004);t.setAttribute('y',-c.endpoint[1]-.004);t.setAttribute('class','rank');t.textContent=c.rank;v.appendChild(t)});const first=(cur.candidates||[])[0];document.getElementById('summary').textContent='BE–LU · frontière + cellules + candidats superposés · '+shown.length+' candidat(s) visible(s) · meilleur écart '+(first?first.distanceKm+' km':'—');let vb=svg.viewBox.baseVal;function zoom(f,cx,cy){let p=svg.createSVGPoint();p.x=cx;p.y=cy;let m=svg.getScreenCTM();if(!m)return;p=p.matrixTransform(m.inverse());vb.x=p.x-(p.x-vb.x)/f;vb.y=p.y-(p.y-vb.y)/f;vb.width/=f;vb.height/=f}svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;vb.x=drag.vx-(e.clientX-drag.x)*vb.width/svg.clientWidth;vb.y=drag.vy-(e.clientY-drag.y)*vb.height/svg.clientHeight});svg.addEventListener('pointerup',()=>drag=null)})().catch(e=>document.getElementById('summary').textContent='Erreur: '+e.message)</script></body></html>
