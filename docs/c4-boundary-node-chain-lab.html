<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>World Conquest · C4.6 Junction Audit</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#f8fafc}#map{position:absolute;inset:0;background:#dce3e8;touch-action:none}svg{width:100%;height:100%;display:block}.panel{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));padding:12px 14px;border-radius:18px;background:rgba(15,23,42,.94);box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:2}h1{margin:0 0 4px;font-size:17px;letter-spacing:.03em}.sub{color:#cbd5e1;font-size:12px;line-height:1.35}.legend{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:9px 11px;border-radius:14px;background:rgba(15,23,42,.9);font-size:11px;line-height:1.7;z-index:2}.sw{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:7px;border-radius:4px}.node{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:9px;background:#fde047;border:2px solid #111827}.anchor-dot{background:#f97316}.cell{stroke:#e2e8f0;stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.38}.cell.BE{fill:#a78bfa}.cell.LU{fill:#bef264}.baseline{fill:none;stroke:#64748b;stroke-width:2.7;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.candidate{fill:#fde047;stroke:#111827;stroke-width:1.4;vector-effect:non-scaling-stroke}.anchor{fill:#f97316}
</style>
</head>
<body>
<div id="map"><svg id="svg"><g id="viewport"></g></svg></div>
<div class="panel"><h1>WORLD CONQUEST · C4.6 JUNCTION AUDIT</h1><div class="sub" id="summary">Chargement…</div></div>
<div class="legend"><div><span class="sw" style="background:#64748b"></span>frontière réelle BE–LU</div><div><span class="node"></span>jonction extraite directement des cellules</div><div><span class="node anchor-dot"></span>extrémité réelle de frontière</div></div>
<script>
(async()=>{
 const [data,graph]=await Promise.all([
  fetch('./c4-boundary-node-chain-lab.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('JSON C4 '+r.status);return r.json()}),
  fetch('./voronoi-graph.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('graphe Voronoï '+r.status);return r.json()})
 ]);
 const svg=document.getElementById('svg'),viewport=document.getElementById('viewport'),summary=document.getElementById('summary'),NS='http://www.w3.org/2000/svg';
 const current=data.pairs[0]; const cells=(graph.cells||[]).filter(c=>['BE','LU'].includes(c.ownerCode)&&c.geometry); let drag=null;
 function addPath(coords,cls){if(!coords||coords.length<2)return;const p=document.createElementNS(NS,'path');p.setAttribute('d','M '+coords.map(x=>`${x[0]} ${-x[1]}`).join(' L '));p.setAttribute('class',cls);viewport.appendChild(p)}
 function polygonPath(rings){return rings.map(r=>'M '+r.map(p=>`${p[0]} ${-p[1]}`).join(' L ')+' Z').join(' ')}
 function geometryPath(g){if(!g)return'';if(g.type==='Polygon')return polygonPath(g.coordinates||[]);if(g.type==='MultiPolygon')return(g.coordinates||[]).map(polygonPath).join(' ');return''}
 function bounds(){const pts=[];current.components.forEach(c=>c.baseline.coordinates.forEach(p=>pts.push(p)));const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let a=Math.min(...xs),b=Math.min(...ys),c=Math.max(...xs),d=Math.max(...ys);const pad=Math.max(.08,Math.max(c-a,d-b)*.22);return[a-pad,b-pad,c+pad,d+pad]}
 function touches(g,b){const pts=[];const walk=x=>{if(!Array.isArray(x))return;if(typeof x[0]==='number'&&typeof x[1]==='number'){pts.push(x);return}x.forEach(walk)};walk(g.coordinates);if(!pts.length)return false;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return!(Math.max(...xs)<b[0]||Math.min(...xs)>b[2]||Math.max(...ys)<b[1]||Math.min(...ys)>b[3])}
 function fit(){const b=bounds();svg.setAttribute('viewBox',`${b[0]} ${-b[3]} ${b[2]-b[0]} ${b[3]-b[1]}`)}
 function draw(){viewport.innerHTML='';const b=bounds();cells.filter(c=>touches(c.geometry,b)).forEach(c=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',geometryPath(c.geometry));p.setAttribute('class','cell '+c.ownerCode);viewport.appendChild(p)});current.components.forEach(c=>addPath(c.baseline.coordinates,'baseline'));(current.nodes||[]).forEach(n=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',n.lon);c.setAttribute('cy',-n.lat);c.setAttribute('r',.012);c.setAttribute('class','candidate '+(n.source==='anchor'?'anchor':''));viewport.appendChild(c)});summary.textContent=`BE–LU · ${current.junctionCount} jonction(s) cellule/frontière · ${current.inspectedCellCount} cellule(s) touchant la frontière · diagnostic uniquement`}
 let vb=svg.viewBox.baseVal;function zoomAt(f,cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;const m=svg.getScreenCTM();if(!m)return;const p=pt.matrixTransform(m.inverse());vb.x=p.x-(p.x-vb.x)/f;vb.y=p.y-(p.y-vb.y)/f;vb.width/=f;vb.height/=f}
 svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;vb.x=drag.vx-(e.clientX-drag.x)*vb.width/svg.clientWidth;vb.y=drag.vy-(e.clientY-drag.y)*vb.height/svg.clientHeight});svg.addEventListener('pointerup',()=>drag=null);fit();draw();
})().catch(err=>document.getElementById('summary').textContent='Erreur: '+err.message)
</script>
</body>
</html>
