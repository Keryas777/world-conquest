<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>World Conquest · C4.22 Edge Span</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#f8fafc}#map{position:absolute;inset:0;background:#dce3e8;touch-action:none}svg{width:100%;height:100%;display:block}.panel{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));padding:12px 14px;border-radius:18px;background:rgba(15,23,42,.95);z-index:2;pointer-events:none}h1{margin:0 0 4px;font-size:17px}.sub{color:#cbd5e1;font-size:12px;line-height:1.35}.legend{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:9px 11px;border-radius:14px;background:rgba(15,23,42,.92);font-size:11px;line-height:1.55;z-index:2;pointer-events:none;max-width:72%}.controls{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;gap:8px}.controls button{width:48px;height:48px;border:1px solid #64748b;border-radius:14px;background:rgba(15,23,42,.94);color:#fff;font-size:24px;font-weight:800}.cell{stroke:#f8fafc;stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.72}.BE{fill:#a78bfa}.LU{fill:#bef264}.baseline{fill:none;stroke:#475569;stroke-width:3.2;vector-effect:non-scaling-stroke}.edge{fill:none;stroke:#f59e0b;stroke-width:2.8;vector-effect:non-scaling-stroke}.candidate{fill:#fde047;stroke:#111827;stroke-width:1.4;vector-effect:non-scaling-stroke}.terminal{fill:#22d3ee;stroke:#111827;stroke-width:1.4;vector-effect:non-scaling-stroke}.rank{fill:#111827;font-size:.016px;font-weight:900;text-anchor:middle;dominant-baseline:central}.info{fill:#111827;font-size:.014px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:.004px;stroke-linejoin:round}</style></head><body><div id="map"><svg id="svg" preserveAspectRatio="xMidYMid meet"><g id="viewport"></g></svg></div><div class="panel"><h1>WORLD CONQUEST · C4.22 EDGE SPAN</h1><div class="sub" id="summary">Chargement…</div></div><div class="legend">jaune = candidats #1/#3/#4 · orange = arête Voronoï complète<br>Mesure nouvelle : longueur réelle de l’arête, sans seuil ni score — diagnostic uniquement</div><div class="controls"><button id="plus">+</button><button id="minus">−</button><button id="reset">⌂</button></div><script>
(async()=>{const[data,graph]=await Promise.all([fetch('./c4-boundary-node-chain-lab.json',{cache:'no-store'}).then(r=>r.json()),fetch('./voronoi-graph.json',{cache:'no-store'}).then(r=>r.json())]);const svg=document.getElementById('svg'),v=document.getElementById('viewport'),NS='http://www.w3.org/2000/svg',cur=data.pairs[0],cells=(graph.cells||[]).filter(c=>['BE','LU'].includes(c.ownerCode)&&c.geometry);let view,initialView,pointers=new Map(),lastPinch=null;
function path(coords,cls){if(!coords||coords.length<2)return;const p=document.createElementNS(NS,'path');p.setAttribute('d','M '+coords.map(x=>x[0]+' '+(-x[1])).join(' L '));p.setAttribute('class',cls);v.appendChild(p)}function poly(rs){return rs.map(r=>'M '+r.map(p=>p[0]+' '+(-p[1])).join(' L ')+' Z').join(' ')}function gp(g){if(g.type==='Polygon')return poly(g.coordinates||[]);if(g.type==='MultiPolygon')return(g.coordinates||[]).map(poly).join(' ');return''}function dot(x,cls,r){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x[0]);c.setAttribute('cy',-x[1]);c.setAttribute('r',r);c.setAttribute('class',cls);v.appendChild(c)}function text(x,y,s,cls,anchor='start'){const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class',cls);t.setAttribute('text-anchor',anchor);t.textContent=s;v.appendChild(t)}
function bounds(){const p=[];cur.components.forEach(c=>c.baseline.coordinates.forEach(x=>p.push(x)));const xs=p.map(x=>x[0]),ys=p.map(x=>x[1]);let a=Math.min(...xs),b=Math.min(...ys),c=Math.max(...xs),d=Math.max(...ys),q=Math.max(.035,Math.max(c-a,d-b)*.16);return[a-q,b-q,c+q,d+q]}function touch(g,b){let p=[];(function w(x){if(!Array.isArray(x))return;if(typeof x[0]==='number'){p.push(x);return}x.forEach(w)})(g.coordinates);let x=p.map(z=>z[0]),y=p.map(z=>z[1]);return p.length&&!(Math.max(...x)<b[0]||Math.min(...x)>b[2]||Math.max(...y)<b[1]||Math.min(...y)>b[3])}function hav(a,b){const R=6371000,rad=Math.PI/180,p1=a[1]*rad,p2=b[1]*rad,dp=(b[1]-a[1])*rad,dl=(b[0]-a[0])*rad,s=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))}function edgeLength(q){let n=0;for(let i=1;i<q.length;i++)n+=hav(q[i-1],q[i]);return n}
const b=bounds();initialView={x:b[0],y:-b[3],w:b[2]-b[0],h:b[3]-b[1]};view={...initialView};function applyView(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}function screenToWorld(cx,cy){const r=svg.getBoundingClientRect(),as=r.width/r.height,av=view.w/view.h;let dw=view.w,dh=view.h,ox=0,oy=0;if(as>av){dw=view.h*as;ox=(view.w-dw)/2}else{dh=view.w/as;oy=(view.h-dh)/2}return{x:view.x+ox+(cx-r.left)/r.width*dw,y:view.y+oy+(cy-r.top)/r.height*dh}}function zoomAt(f,cx,cy){const a=screenToWorld(cx,cy);view.w/=f;view.h/=f;const n=screenToWorld(cx,cy);view.x+=a.x-n.x;view.y+=a.y-n.y;applyView()}function reset(){view={...initialView};applyView()}applyView();cells.filter(c=>touch(c.geometry,b)).forEach(c=>{let p=document.createElementNS(NS,'path');p.setAttribute('d',gp(c.geometry));p.setAttribute('class','cell '+c.ownerCode);v.appendChild(p)});cur.components.forEach(c=>path(c.baseline.coordinates,'baseline'));
const shortlist=(cur.endpointDiagnostics||[]).map((d,i)=>({...d,source:i+1})).filter(d=>[1,3,4].includes(d.source)).map(d=>({...d,edgeMeters:edgeLength(d.edge.coordinates||[])}));shortlist.forEach(d=>{path(d.edge.coordinates,'edge');dot(d.endpoint,'candidate',.009);text(d.endpoint[0],-d.endpoint[1],String(d.source),'rank','middle');text(d.endpoint[0]+.012,-d.endpoint[1]-.012,`#${d.source} · arête ${(d.edgeMeters/1000).toFixed(2)} km · bord ${d.distanceMeters.toFixed(1)} m`,'info')});(cur.terminals||[]).forEach(t=>dot(t.point,'terminal',.010));document.getElementById('summary').textContent='BE–LU · longueur des arêtes candidates : '+shortlist.map(d=>`#${d.source}: ${(d.edgeMeters/1000).toFixed(2)} km`).join(' · ');
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});svg.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});svg.setPointerCapture(e.pointerId);if(pointers.size===2){const a=[...pointers.values()];lastPinch={dist:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}}});svg.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const a=screenToWorld(old.x,old.y),n=screenToWorld(e.clientX,e.clientY);view.x+=a.x-n.x;view.y+=a.y-n.y;applyView()}else if(pointers.size===2){const a=[...pointers.values()],dist=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;if(lastPinch&&lastPinch.dist>0)zoomAt(dist/lastPinch.dist,cx,cy);lastPinch={dist}}});function end(e){pointers.delete(e.pointerId);lastPinch=null}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);document.getElementById('plus').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.5,r.left+r.width/2,r.top+r.height/2)};document.getElementById('minus').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.5,r.left+r.width/2,r.top+r.height/2)};document.getElementById('reset').onclick=reset;
})().catch(e=>document.getElementById('summary').textContent='Erreur: '+e.message)</script></body></html>
