<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Conquest — Frontières</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071022;color:#eef3ff}.top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;background:rgba(7,16,34,.94);border:1px solid #2a3555;border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px #0006}.top b{font-size:15px}.muted{font-size:11px;color:#aab5cf;margin-top:3px}.legend{position:absolute;z-index:1000;right:10px;bottom:20px;background:rgba(7,16,34,.94);border:1px solid #2a3555;border-radius:12px;padding:9px;font-size:11px}.error{position:absolute;z-index:2000;left:16px;right:16px;top:150px;padding:16px;background:#431313;border:1px solid #ff6b6b;border-radius:12px;display:none}</style></head><body><div id="map"></div><div class="top"><b>🕸️ Graphe frontalier — laboratoire 60/40</b><div class="muted">FR 85 · BE 18 · LU 3 · DE 75 · CH 20 · IT 55 · ES 65 · candidats ≤ 180 km</div></div><div class="legend">Clique une ville pour voir ses liaisons.</div><div id="err" class="error"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>
(async()=>{try{const src=await fetch('frontiers.html?data=1',{cache:'no-store'}).then(r=>r.text());const m=src.match(/const z='([^']+)'/);if(!m)throw new Error('Données compressées introuvables');const bin=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));const d=JSON.parse(pako.ungzip(bin,{to:'string'}));const cities=d.c,edges=d.e;const colors={FR:'#3178ff',BE:'#ff9d19',LU:'#ef3d5c',DE:'#8b5cf6',CH:'#f43f5e',IT:'#22c55e',ES:'#facc15'};const byId=new Map(cities.map(c=>[c.id,c]));const map=L.map('map').setView([48,5],5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:13,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const edgeLines=[];for(const e of edges){const a=byId.get(e.a),b=byId.get(e.b);if(!a||!b)continue;const line=L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{color:'#ffcf5a',weight:1.2,opacity:.28}).addTo(map);edgeLines.push({e,line});}for(const c of cities){const linked=edges.filter(e=>e.a===c.id||e.b===c.id);L.circleMarker([c.lat,c.lon],{radius:5,color:'#fff',weight:1,fillColor:colors[c.country]||'#aaa',fillOpacity:.9}).bindPopup(`<b>${c.name}</b> (${c.country})<br>${Number(c.population).toLocaleString('fr-FR')} hab.<br><b>${linked.length}</b> liaison(s)<br>${linked.slice(0,12).map(e=>{const o=byId.get(e.a===c.id?e.b:e.a);return o?`${o.name} (${o.country}) — ${e.km} km`:''}).filter(Boolean).join('<br>')}`).on('click',()=>{for(const x of edgeLines)x.line.setStyle({opacity:(x.e.a===c.id||x.e.b===c.id)?.95:.06,weight:(x.e.a===c.id||x.e.b===c.id)?3:1})}).addTo(map);}map.fitBounds(cities.map(c=>[c.lat,c.lon]),{padding:[20,20]});}catch(e){const el=document.getElementById('err');el.textContent='Erreur de chargement : '+e.message;el.style.display='block';console.error(e);}})();
</script></body></html>
