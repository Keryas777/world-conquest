<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>World Conquest · Comparaison mondiale des frontières</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101827;color:#f8fafc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}#map{position:absolute;inset:0;background:#dbe4ea;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;z-index:2;max-width:760px;padding:10px 12px;border:1px solid #475569;border-radius:14px;background:rgba(15,23,42,.96);box-shadow:0 5px 22px #0005}.title{font-size:15px;font-weight:800}.status{margin-top:3px;color:#cbd5e1;font-size:11px}.warning{color:#fbbf24}.toolbar{display:flex;gap:6px;align-items:center;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:thin}.toolbar select,.toolbar button,.controls button{min-height:40px;border:1px solid #64748b;border-radius:10px;background:#1e293b;color:white;font:inherit}.toolbar select{padding:0 8px;flex:1;min-width:115px}.toolbar button{padding:0 10px;white-space:nowrap;font-size:12px;font-weight:700}.toolbar button.active,.toolbar button[aria-pressed="true"]{background:#b91c1c;border-color:#fecaca}.controls{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;gap:6px}.controls button{width:48px;height:48px;background:rgba(15,23,42,.96);font-size:22px;font-weight:800}.card{position:absolute;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;max-width:min(72vw,460px);max-height:32vh;overflow:auto;padding:8px 10px;border:1px solid #64748b;border-radius:12px;background:rgba(15,23,42,.94);font-size:11px;line-height:1.4;pointer-events:none}.card strong{font-size:12px}.legend{color:#cbd5e1}.pair{color:#f8fafc}.measure{color:#cbd5e1}.fallback{position:absolute;inset:50% 20px auto;transform:translateY(-50%);z-index:4;text-align:center;padding:16px;border-radius:14px;background:#111827;color:#f8fafc}.hidden{display:none}@media(min-width:850px){.top{left:16px;right:auto}.card{left:auto;right:76px;bottom:16px;max-width:500px}.controls{right:16px;bottom:16px}}
</style>
</head>
<body>
<main id="map"><canvas id="canvas" aria-label="Carte mondiale des cellules et frontières territoriales"></canvas></main>
<section class="top" aria-label="Commandes de comparaison">
  <div class="title">WORLD CONQUEST · FRONTIÈRES MONDIALES</div>
  <div class="status" id="status">Chargement des géométries…</div>
  <div class="toolbar">
    <button id="world" type="button" class="active">Monde</button>
    <select id="pair" aria-label="Frontière à examiner"></select>
    <select id="anomaly" aria-label="Accès direct aux anomalies"><option value="">Anomalies de la campagne</option></select>
    <button id="reconstruct" type="button" aria-pressed="false">Cellules reconstruites</button>
    <button id="original" type="button">Originale</button>
    <button id="ref40" type="button">40 · 0,040°</button>
    <button id="ref85" type="button">85 · 0,085°</button>
    <button id="protected" type="button">Angles protégés</button>
    <button id="adaptive" type="button">Adaptatif</button>
  </div>
</section>
<aside class="card" id="details" aria-live="polite"></aside>
<div class="controls" aria-label="Commandes de zoom">
  <button id="plus" type="button" aria-label="Zoom avant">+</button>
  <button id="minus" type="button" aria-label="Zoom arrière">−</button>
  <button id="fit" type="button" aria-label="Afficher le monde entier">⌂</button>
</div>
<div id="fallback" class="fallback hidden" role="status">Le jeu de résultats mondial est absent. Le générer avec le workflow « City selection lab » en mode global.</div>
<script>
(()=>{
  const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false});
  const status=document.getElementById('status'),pairSelect=document.getElementById('pair');
  const anomalySelect=document.getElementById('anomaly'),details=document.getElementById('details');
  const fallback=document.getElementById('fallback'),methodIds=['original','ref40','ref85','protected','adaptive'];
  let graph,results,reconstructionSummary,pairIndex=0,method='original',scope='world',cellMode='source';
  let view={x:-180,y:-90,w:360,h:180},fitView={...view},dpr=1,cells=[],cellsByTerritory=new Map();
  let reconstructedCells=[],reconstructedByTerritory=new Map(),reconstructionMetadata=null;
  const colors=new Map();
  function color(code){if(!colors.has(code)){let h=0;for(const c of code)h=(h*31+c.charCodeAt(0))%360;colors.set(code,`hsl(${h} 44% 64%)`)}return colors.get(code)}
  function geometryPaths(g){const list=[];if(!g)return list;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const poly of polys)for(const ring of poly||[])if(ring.length>1)list.push(ring);return list}
  function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));draw()}
  function screen(x,y){const w=canvas.clientWidth,h=canvas.clientHeight,scale=Math.min(w/view.w,h/view.h),ox=(w-view.w*scale)/2,oy=(h-view.h*scale)/2;return[ox+(x-view.x)*scale,oy+(view.y+view.h-y)*scale]}
  function drawRing(ring){let p=screen(ring[0][0],ring[0][1]);ctx.moveTo(p[0]*dpr,p[1]*dpr);let last=p;for(let i=1;i<ring.length;i++){p=screen(ring[i][0],ring[i][1]);if(Math.hypot(p[0]-last[0],p[1]-last[1])>=.35||i===ring.length-1){ctx.lineTo(p[0]*dpr,p[1]*dpr);last=p}}ctx.closePath()}
  function num(x,d=1){return Number.isFinite(x)?x.toLocaleString('fr-FR',{maximumFractionDigits:d}):'—'}
  function displayedCells(){return cellMode==='reconstructed'?reconstructedCells:cells}
  function displayedByTerritory(){return cellMode==='reconstructed'?reconstructedByTerritory:cellsByTerritory}
  function loadCellsByTerritory(items){const grouped=new Map();for(const cell of items){const code=cell.territoryCode||'';if(!grouped.has(code))grouped.set(code,[]);grouped.get(code).push(cell)}return grouped}
  function draw(){if(!graph||!results)return;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#dbe4ea';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineJoin='round';ctx.lineCap='round';
    const source=displayedCells(),byTerritory=displayedByTerritory();
    const pairCells=scope==='world'?source:(results.pairs[pairIndex]?.territories||[]).flatMap(code=>byTerritory.get(code)||[]);
    for(const cell of pairCells){ctx.beginPath();for(const ring of geometryPaths(cell.geometry))drawRing(ring);ctx.fillStyle=color(cell.ownerCode||cell.territoryCode||'');ctx.globalAlpha=.86;ctx.fill('evenodd');ctx.globalAlpha=1;ctx.strokeStyle='#ffffffb0';ctx.lineWidth=Math.max(.5,dpr*.5);ctx.stroke()}
    if(cellMode==='source'||scope==='pair'){
      const selected=scope==='world'?results.pairs:[results.pairs[pairIndex]];
      for(const pair of selected){if(!pair)continue;const geometry=method==='original'?pair.source.geometry:pair.variants[method]?.geometry;if(!geometry)continue;ctx.beginPath();for(const line of geometry.coordinates||[])if(line.length){let p=screen(line[0][0],line[0][1]);ctx.moveTo(p[0]*dpr,p[1]*dpr);for(let i=1;i<line.length;i++){p=screen(line[i][0],line[i][1]);ctx.lineTo(p[0]*dpr,p[1]*dpr)}}ctx.strokeStyle=method==='original'?'#334155':'#dc2626';ctx.lineWidth=Math.max(1.8,dpr*2);ctx.stroke()}
    }
    if(scope==='pair'){const pair=results.pairs[pairIndex];for(const candidate of pair?.nearbyFusionCandidates||[]){const a=screen(candidate.a[0],candidate.a[1]),b=screen(candidate.b[0],candidate.b[1]);ctx.beginPath();ctx.setLineDash([5*dpr,4*dpr]);ctx.moveTo(a[0]*dpr,a[1]*dpr);ctx.lineTo(b[0]*dpr,b[1]*dpr);ctx.strokeStyle='#9333ea';ctx.lineWidth=2*dpr;ctx.stroke();ctx.setLineDash([])}for(const junction of pair?.junctions||[]){const p=screen(junction.borderPoint[0],junction.borderPoint[1]);ctx.beginPath();ctx.arc(p[0]*dpr,p[1]*dpr,4*dpr,0,Math.PI*2);ctx.fillStyle=junction.classification==='transverse'?'#06b6d4':junction.classification==='boundary-parallel'?'#f97316':'#eab308';ctx.fill();ctx.strokeStyle='#0f172a';ctx.lineWidth=1.5*dpr;ctx.stroke()}const reference=reconstructionSummary?.junctions?.belgiumLuxembourgReference?.referenceAnchor;if(pair?.key==='BE-LU'&&reference){const p=screen(reference[0],reference[1]);ctx.beginPath();ctx.arc(p[0]*dpr,p[1]*dpr,6*dpr,0,Math.PI*2);ctx.strokeStyle='#a855f7';ctx.lineWidth=2*dpr;ctx.stroke()}}
    updateDetails(scope==='world'?null:results.pairs[pairIndex]);
  }
  function updateDetails(pair){
    if(cellMode==='reconstructed'&&reconstructionMetadata){const m=reconstructionMetadata;
      if(!pair){details.innerHTML=`<strong>Monde reconstruit · ${results.methods[method]?.label||method}</strong><br><span class="measure">${num(m.cellCount,0)} cellules · ${m.territoryCount} territoires · surface gagnée ${num(m.cellGainedKm2,1)} km² · perdue ${num(m.cellLostKm2,1)} km²</span><br><span class="legend">${m.invalidCellCount} cellule invalide · ${m.cellAdjacencyLostCount} adjacence perdue · ${m.cellAdjacencyCreatedCount} créée · ${m.locallyRestoredBorderCount} frontières revenues au contour source · repli global : ${m.globalSourceContourFallback?'oui':'non'}</span>`;return}
      const selected=new Set(pair.territories),items=(m.territoryMetrics||[]).filter(item=>selected.has(item.territory));
      const area=items.reduce((sum,item)=>sum+item.areaAfterKm2-item.areaBeforeKm2,0),gain=items.reduce((sum,item)=>sum+item.gainedKm2,0),loss=items.reduce((sum,item)=>sum+item.lostKm2,0);
      details.innerHTML=`<strong class="pair">${pair.key} · cellules ${results.methods[method]?.label||method}</strong><br><span class="measure">${pair.crossOwnerVoronoiEdgeCount} arêtes de graphe · surface territoriale nette ${num(area,2)} km² · gagnée ${num(gain,2)} km² · perdue ${num(loss,2)} km²</span><br><span class="legend">${pair.junctionSummary?.nearbyDistinctIncidencePairs||0} paires de jonctions à examiner ; les connexions des cellules sont contrôlées après découpage</span>`;return
    }
    if(!pair){const m=method==='original'?null:results.methods[method],label=method==='original'?'Frontières source':m?.label||method;
      details.innerHTML=m?`<strong>Vue mondiale · ${label}</strong><br><span class="measure">${num(m.outputVertices,0)} sommets · ${num(m.totalLengthAfterKm,1)} km · ${num(m.vertexReductionRatio*100,1)} % de sommets supprimés · écart max. ${num(m.maxDeviationMeters/1000,2)} km</span><br><span class="warning">La carte reste sur les cellules d’origine. Activez « Cellules reconstruites » pour charger les vrais polygones.</span>`:`<strong>Vue mondiale · carte originale</strong><br><span class="measure">${results.source.cellCount.toLocaleString('fr-FR')} cellules · ${results.source.territoryCount} territoires · ${results.pairs.length} couples frontaliers comparés</span>`;return}
    const variant=method==='original'?pair.source:pair.variants[method],label=method==='original'?'Frontière source':results.methods[method]?.label||method;
    details.innerHTML=`<strong class="pair">${pair.key} · ${label}</strong><br><span class="measure">${num(variant.vertexCount,0)} sommets · ${num(variant.lengthKm,1)} km${method==='original'?'':` · écart max. ${num(variant.maxDeviationMeters/1000,2)} km`}</span><br><span class="legend">${pair.crossOwnerVoronoiEdgeCount} arêtes · ${pair.missingSharedLineIntersectionCount} sans ligne directe · ${variant.nonSimpleLineComponentCount||0} composants non simples · ${pair.junctionSummary?.nearbyDistinctIncidencePairs||0} paires de jonctions rapprochées ; aucune fusion forcée</span>`;
  }
  function updatePairOptions(){const problem=document.createElement('optgroup');problem.label='À vérifier · contacts ou lignes non simples';const deviations=document.createElement('optgroup');deviations.label='Écarts les plus élevés';const all=document.createElement('optgroup');all.label='Toutes les frontières';const option=pair=>{const item=document.createElement('option');item.value=String(results.pairs.indexOf(pair));item.textContent=`${pair.key} · ${pair.crossOwnerVoronoiEdgeCount} arêtes`;return item};
    const issues=results.pairs.filter(pair=>pair.missingSharedLineIntersectionCount>0||Object.values(pair.variants||{}).some(value=>value.nonSimpleLineComponentCount>0)).sort((a,b)=>b.missingSharedLineIntersectionCount-a.missingSharedLineIntersectionCount||a.key.localeCompare(b.key));
    for(const item of issues){const o=option(item);o.textContent+=` · direct ${item.missingSharedLineIntersectionCount}`;problem.appendChild(o)}
    for(const item of [...results.pairs].sort((a,b)=>(b.variants[method]?.maxDeviationMeters||0)-(a.variants[method]?.maxDeviationMeters||0)).slice(0,20)){const o=option(item);o.textContent+=` · écart ${num(item.variants[method]?.maxDeviationMeters/1000,2)} km`;deviations.appendChild(o)}
    for(const item of results.pairs)all.appendChild(option(item));pairSelect.replaceChildren(problem,deviations,all);pairSelect.value=String(pairIndex);
  }
  async function loadReconstruction(nextMethod){if(reconstructionMetadata?.method===nextMethod&&reconstructedCells.length)return;
    status.textContent=`Chargement de la carte reconstruite ${nextMethod}…`;
    try{const response=await fetch(`./global-frontier-reconstruction-${nextMethod}.geojson`);if(!response.ok)throw Error('reconstruction');const data=await response.json();
      reconstructedCells=data.features.map(feature=>({...feature.properties,geometry:feature.geometry}));reconstructedByTerritory=loadCellsByTerritory(reconstructedCells);reconstructionMetadata=data.metadata;
      status.textContent=`Carte reconstruite ${nextMethod} · ${reconstructedCells.length.toLocaleString('fr-FR')} cellules · ${data.metadata.territoryCount} territoires · empreinte géométrique ${data.metadata.geometrySha256||''}`;
    }catch(error){cellMode='source';document.getElementById('reconstruct').setAttribute('aria-pressed','false');status.textContent='Géométrie reconstruite indisponible ou invalide.';fallback.classList.remove('hidden')}
    draw();
  }
  function setMethod(next){method=next;for(const id of methodIds)document.getElementById(id).classList.toggle('active',id===next);
    if(next==='original'){cellMode='source';document.getElementById('reconstruct').setAttribute('aria-pressed','false')}
    if(results)updatePairOptions();if(cellMode==='reconstructed'&&next!=='original')loadReconstruction(next);else if(scope==='pair')fitPair();else draw();
  }
  function bounds(g){const points=[];for(const line of g?.coordinates||[])for(const point of line)points.push(point);if(!points.length)return null;const xs=points.map(point=>point[0]),ys=points.map(point=>point[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),pad=Math.max(.04,Math.max(x1-x0,y1-y0)*.18);return{x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2}}
  function fitPair(){const pair=results.pairs[pairIndex],geometry=method==='original'?pair.source.geometry:pair.variants[method].geometry,b=bounds(geometry);if(b)view=b;draw()}
  pairSelect.addEventListener('change',()=>{pairIndex=Number(pairSelect.value);scope='pair';document.getElementById('world').classList.remove('active');anomalySelect.value='';fitPair()});
  anomalySelect.addEventListener('change',()=>{const item=reconstructionSummary?.source?.missingDirectCellBoundaryEdges?.[Number(anomalySelect.value)];if(!item)return;const key=[item.territoryA,item.territoryB].sort().join('-'),index=results.pairs.findIndex(pair=>pair.key===key);if(index>=0){pairIndex=index;pairSelect.value=String(index);scope='pair';document.getElementById('world').classList.remove('active');fitPair()}else{scope='world';draw();details.innerHTML=`<strong class="pair">Anomalie ${item.cellA}–${item.cellB} · ${key}</strong><br><span class="measure">${item.classification} · écart minimal ${num(item.nearestBoundaryDistanceMeters,2)} m · propriétaires ${item.ownerA}/${item.ownerB}</span>`}});
  document.getElementById('world').onclick=()=>{scope='world';view={...fitView};document.getElementById('world').classList.add('active');draw()};
  for(const id of methodIds)document.getElementById(id).addEventListener('click',()=>setMethod(id));
  document.getElementById('reconstruct').onclick=()=>{cellMode='reconstructed';method=method==='original'?'adaptive':method;for(const id of methodIds)document.getElementById(id).classList.toggle('active',id===method);document.getElementById('reconstruct').setAttribute('aria-pressed','true');loadReconstruction(method)};
  document.getElementById('plus').onclick=()=>zoom(1.5);document.getElementById('minus').onclick=()=>zoom(1/1.5);document.getElementById('fit').onclick=()=>{view={...fitView};draw()};
  function zoom(f,cx=canvas.clientWidth/2,cy=canvas.clientHeight/2){const scale=Math.min(canvas.clientWidth/view.w,canvas.clientHeight/view.h),wx=view.x+(cx-(canvas.clientWidth-view.w*scale)/2)/scale,wy=view.y+view.h-(cy-(canvas.clientHeight-view.h*scale)/2)/scale;view.w/=f;view.h/=f;const nextScale=Math.min(canvas.clientWidth/view.w,canvas.clientHeight/view.h);view.x=wx-(cx-(canvas.clientWidth-view.w*nextScale)/2)/nextScale;view.y=wy-view.h+(cy-(canvas.clientHeight-view.h*nextScale)/2)/nextScale;draw()}
  const pointers=new Map();let lastDistance=0,lastCenter=null;
  canvas.addEventListener('pointerdown',event=>{try{canvas.setPointerCapture(event.pointerId)}catch{}pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});if(pointers.size===2){const points=[...pointers.values()];lastDistance=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);lastCenter={x:(points[0].x+points[1].x)/2,y:(points[0].y+points[1].y)/2}}});
  canvas.addEventListener('pointermove',event=>{if(!pointers.has(event.pointerId))return;const before=pointers.get(event.pointerId),dx=event.clientX-before.x,dy=event.clientY-before.y;pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});canvas.dataset.lastGesture=pointers.size>=2?'pinch':'pan';if(pointers.size<2)canvas.dataset.panCount=String(Number(canvas.dataset.panCount||0)+1);if(pointers.size>=2){const points=[...pointers.values()],distance=Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y),center={x:(points[0].x+points[1].x)/2,y:(points[0].y+points[1].y)/2};if(lastDistance>0)zoom(distance/lastDistance,center.x-canvas.getBoundingClientRect().left,center.y-canvas.getBoundingClientRect().top);if(lastCenter){const scale=Math.min(canvas.clientWidth/view.w,canvas.clientHeight/view.h);view.x-=(center.x-lastCenter.x)/scale;view.y+=(center.y-lastCenter.y)/scale;draw()}lastDistance=distance;lastCenter=center}else{const scale=Math.min(canvas.clientWidth/view.w,canvas.clientHeight/view.h);view.x-=dx/scale;view.y+=dy/scale;draw()}});
  function endPointer(event){pointers.delete(event.pointerId);if(pointers.size<2){lastDistance=0;lastCenter=null}}
  canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('wheel',event=>{event.preventDefault();zoom(event.deltaY<0?1.15:1/1.15,event.offsetX,event.offsetY)},{passive:false});
  function populateAnomalies(){const rows=reconstructionSummary?.source?.missingDirectCellBoundaryEdges||[];for(let i=0;i<rows.length;i++){const row=rows[i],option=document.createElement('option');option.value=String(i);option.textContent=`${row.territoryA}–${row.territoryB} · ${row.classification} · ${num(row.nearestBoundaryDistanceMeters,1)} m`;anomalySelect.appendChild(option)}}
  Promise.all([fetch('./voronoi-graph.json').then(response=>{if(!response.ok)throw Error('graph');return response.json()}),fetch('./global-frontier-results.json').then(response=>{if(!response.ok)throw Error('results');return response.json()}),fetch('./global-frontier-reconstruction-summary.json').then(response=>response.ok?response.json():null)]).then(([g,r,s])=>{
    graph=g;results=r;reconstructionSummary=s;cells=g.cells||[];if(!results.pairs?.length)throw Error('empty');cellsByTerritory=loadCellsByTerritory(cells);updatePairOptions();populateAnomalies();fitView={x:-180,y:-90,w:360,h:180};view={...fitView};status.textContent=`${cells.length.toLocaleString('fr-FR')} cellules source · ${r.source.territoryCount} territoires · ${r.pairs.length} frontières candidates`;resize();draw()
  }).catch(()=>{fallback.classList.remove('hidden');status.textContent='Données de comparaison indisponibles'});
  new ResizeObserver(resize).observe(canvas);
})();
</script>
</body>
</html>
