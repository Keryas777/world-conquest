<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World Conquest — Map Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c1621;font-family:system-ui,-apple-system,sans-serif;color:#fff}
#map{width:100%;height:100%;touch-action:none;display:block}.hud{position:fixed;z-index:5;left:12px;top:max(12px,env(safe-area-inset-top));background:#111c27dd;border:1px solid #ffffff25;border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px);font-size:12px}
.hud b{font-size:15px}.controls{position:fixed;z-index:6;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px}.controls button{border:1px solid #ffffff35;background:#111c27e8;color:#fff;border-radius:10px;padding:9px 11px;font-weight:700}
.legend{position:fixed;z-index:5;left:12px;bottom:max(12px,env(safe-area-inset-bottom));background:#111c27dd;border-radius:12px;padding:8px 10px;font-size:11px;color:#dbe5ee}
.country{stroke:#eaf1f4;stroke-width:.7;vector-effect:non-scaling-stroke}.city circle{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}.city text{fill:#fff;font-weight:750;paint-order:stroke;stroke:#17222c;stroke-width:3px;stroke-linejoin:round}.army{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke;opacity:.92}.unit{fill:#fff;stroke:#17222c;stroke-width:1.2;vector-effect:non-scaling-stroke}
</style></head><body>
<svg id="map"></svg>
<div class="hud"><b>WORLD CONQUEST · MAP LAB</b><br><span id="status">Europe occidentale · 50m</span></div>
<div class="controls"><button id="reset">Recentrer</button><button id="units">Unités ✓</button></div>
<div class="legend">Fond vectoriel simplifié · villes + mouvements = couches séparées</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
const svg=d3.select("#map"), W=innerWidth,H=innerHeight;
svg.attr("viewBox",[0,0,W,H]);
const ocean=svg.append("rect").attr("width",W).attr("height",H).attr("fill","#8db8c8");
const root=svg.append("g");
const palette=["#d7d9d6","#d7d9d6","#d7d9d6"];
const owners={"250":"#557fba","276":"#d88b6d","380":"#70a77c","724":"#d6a657","826":"#9b78b4","056":"#d79bb1","528":"#74a9a5","756":"#bdafa1","620":"#c88d69"};
const cities=[
["Paris",2.3522,48.8566,126],["Lyon",4.8357,45.764,83],["Marseille",5.3698,43.2965,59],["Bordeaux",-0.5792,44.8378,41],["Lille",3.0573,50.6292,37],
["Londres",-0.1276,51.5072,94],["Bruxelles",4.3517,50.8503,51],["Amsterdam",4.9041,52.3676,46],["Berlin",13.405,52.52,108],["Munich",11.582,48.1351,67],
["Milan",9.19,45.4642,72],["Rome",12.4964,41.9028,79],["Madrid",-3.7038,40.4168,88],["Barcelone",2.1734,41.3851,61],["Genève",6.1432,46.2044,29]
];
const routes=[["Lyon","Bruxelles",42],["Munich","Paris",31],["Marseille","Rome",26]];
let showUnits=true;
const projection=d3.geoMercator().center([5.5,47]).scale(Math.min(W,H)*3.05).translate([W/2,H/2]);
const path=d3.geoPath(projection);
function drawCities(){
 const layer=root.append("g").attr("class","gameplay");
 const by=Object.fromEntries(cities.map(c=>[c[0],c]));
 routes.forEach((r,i)=>{const a=projection([by[r[0]][1],by[r[0]][2]]),b=projection([by[r[1]][1],by[r[1]][2]]);layer.append("path").attr("class","army").attr("d",`M${a[0]},${a[1]} Q${(a[0]+b[0])/2},${(a[1]+b[1])/2-35} ${b[0]},${b[1]}`);const p=[a[0]+(b[0]-a[0])*.55,a[1]+(b[1]-a[1])*.55-18];layer.append("circle").attr("class","unit").attr("cx",p[0]).attr("cy",p[1]).attr("r",5);layer.append("text").attr("x",p[0]+8).attr("y",p[1]+4).attr("fill","#fff").attr("font-size",11).attr("font-weight",800).text(r[2]+"k")});
 const c=layer.selectAll(".city").data(cities).enter().append("g").attr("class","city").attr("transform",d=>`translate(${projection([d[1],d[2]])})`);
 c.append("circle").attr("r",d=>d[3]>80?6:5).attr("fill","#182532");c.append("text").attr("x",8).attr("y",-2).attr("font-size",12).text(d=>d[0]);c.append("text").attr("x",8).attr("y",10).attr("font-size",9).text(d=>d[3]+"k");
}
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(r=>r.json()).then(world=>{
 const features=topojson.feature(world,world.objects.countries).features;
 root.selectAll("path.country").data(features).enter().append("path").attr("class","country").attr("fill",d=>owners[String(d.id).padStart(3,"0")]||"#c8cdca").attr("d",path);
 drawCities();
 svg.call(d3.zoom().scaleExtent([.7,12]).on("zoom",e=>root.attr("transform",e.transform)));
}).catch(e=>document.querySelector("#status").textContent="Erreur de chargement de la géométrie");
document.querySelector("#reset").onclick=()=>svg.transition().duration(350).call(d3.zoom().transform,d3.zoomIdentity);
document.querySelector("#units").onclick=e=>{showUnits=!showUnits;document.querySelector(".gameplay").style.display=showUnits?"":"none";e.target.textContent="Unités "+(showUnits?"✓":"✕")};
</script></body></html>
