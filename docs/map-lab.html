<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World Conquest — Map Lab</title>
<style>
:root{
  --ocean:#8fb6c4;--neutral:#c8cdca;--border:#eef4f6;--panel:#101b26e8;--text:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1520;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
#map{width:100%;height:100%;display:block;touch-action:none;background:var(--ocean)}
.country{stroke:var(--border);stroke-width:.75;vector-effect:non-scaling-stroke}
.city circle{stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke}
.city text{fill:#fff;font-weight:750;paint-order:stroke;stroke:#16212b;stroke-width:3px;stroke-linejoin:round}
.army-route{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke;opacity:.92}
.army-dot{fill:#fff;stroke:#17222c;stroke-width:1.2;vector-effect:non-scaling-stroke}
.army-label{fill:#fff;font-size:11px;font-weight:850;paint-order:stroke;stroke:#17222c;stroke-width:3px}
.panel{position:fixed;z-index:10;background:var(--panel);border:1px solid #ffffff26;border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.header{left:12px;right:12px;top:max(10px,env(safe-area-inset-top));padding:10px 12px}
.title{font-weight:900;font-size:15px;letter-spacing:.2px}.sub{font-size:11px;color:#c9d6df;margin-top:2px}
.toolbar{left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));padding:8px;display:grid;gap:7px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
button{border:1px solid #ffffff28;background:#1b2936;color:#eef5f8;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;white-space:nowrap}
button.active{background:#fff;color:#17222c;border-color:#fff}
#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:#0b152088;font-weight:800;text-align:center;padding:30px}
.badge{margin-left:auto;font-size:10px;color:#b8c7d2;padding:7px 2px}
.style-state{--ocean:#d9e0e3;--neutral:#bfc2c3;--border:#fff}
.style-dark{--ocean:#172536;--neutral:#394858;--border:#8fa0ad;--panel:#07111be8}
.style-dark .city text,.style-dark .army-label{stroke:#0b141d}
.style-pastel{--ocean:#a9ccd4;--neutral:#d8d8d1;--border:#f7f7f3}
@media (min-width:800px){.header{left:18px;right:auto;min-width:340px}.toolbar{left:18px;right:auto;width:auto;min-width:520px}}
</style>
</head>
<body class="style-state">
<svg id="map"></svg>
<div class="panel header">
  <div class="title">WORLD CONQUEST · MAP LAB</div>
  <div class="sub" id="status">Monde · 110m · State-like · LOD auto</div>
</div>
<div class="panel toolbar">
  <div class="row">
    <button class="active">LOD auto</button>
    <span class="badge">110m monde → 50m continent → 10m local</span>
  </div>
  <div class="row" id="styles">
    <button data-style="state" class="active">State-like</button>
    <button data-style="pastel">Pastel</button>
    <button data-style="dark">Dark</button>
    <span class="badge">style</span>
  </div>
  <div class="row">
    <button id="toggleGameplay" class="active">Unités ✓</button>
    <button id="toggleLabels" class="active">Labels ✓</button>
    <button id="reset">Recentrer</button>
  </div>
</div>
<div id="loading">Chargement de la carte…</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
const svg=d3.select("#map");
const root=svg.append("g");
const lodLayers={};
const gameplayLayer=root.append("g").attr("class","gameplay-layer");
const ownerByNumeric={"250":"#657bc4","056":"#657bc4","276":"#d77b62","528":"#d77b62","380":"#5fa97b","724":"#d4a53c","620":"#d4a53c","826":"#9d71b8","756":"#aeb3b5"};
const ownerByA3={FRA:"#657bc4",BEL:"#657bc4",DEU:"#d77b62",NLD:"#d77b62",ITA:"#5fa97b",ESP:"#d4a53c",PRT:"#d4a53c",GBR:"#9d71b8",CHE:"#aeb3b5"};
const cities=[
["Paris",2.3522,48.8566,126],["Lyon",4.8357,45.764,83],["Marseille",5.3698,43.2965,59],["Bordeaux",-0.5792,44.8378,41],["Lille",3.0573,50.6292,37],
["Londres",-0.1276,51.5072,94],["Bruxelles",4.3517,50.8503,51],["Amsterdam",4.9041,52.3676,46],["Berlin",13.405,52.52,108],["Munich",11.582,48.1351,67],
["Milan",9.19,45.4642,72],["Rome",12.4964,41.9028,79],["Madrid",-3.7038,40.4168,88],["Barcelone",2.1734,41.3851,61],["Genève",6.1432,46.2044,29]
];
const routes=[["Lyon","Bruxelles",42,.55],["Munich","Paris",31,.38],["Marseille","Rome",26,.66]];
let W,H,projection,path,currentLod="110",currentStyle="state",showGameplay=true,showLabels=true,currentTransform=d3.zoomIdentity;
const featureCache={}, prepared=new Set(), loading=new Map();

const LOD_UP_110_TO_50=2.35;
const LOD_UP_50_TO_10=8.5;
const LOD_DOWN_10_TO_50=7.5;
const LOD_DOWN_50_TO_110=2.1;

function lodForScale(k){
 if(currentLod==="110") return k>=LOD_UP_110_TO_50?"50":"110";
 if(currentLod==="50"){
   if(k<LOD_DOWN_50_TO_110)return "110";
   if(k>=LOD_UP_50_TO_10)return "10";
   return "50";
 }
 if(k<LOD_DOWN_10_TO_50)return "50";
 return "10";
}
function viewName(){return currentLod==="110"?"Monde":currentLod==="50"?"Continent":"Régional"}
function countryFill(d){
 const numeric=String(d.id??"").padStart(3,"0");
 if(ownerByNumeric[numeric])return ownerByNumeric[numeric];
 const p=d.properties||{},a3=p.ADM0_A3||p.ISO_A3||p.SOV_A3||p.GU_A3||"";
 return ownerByA3[a3]||getComputedStyle(document.body).getPropertyValue("--neutral").trim()||"#bfc2c3";
}
function updateStatus(){
 document.querySelector("#status").textContent=viewName()+" · "+currentLod+"m · "+({"state":"State-like","pastel":"Pastel","dark":"Dark"})[currentStyle]+" · LOD auto";
}
function setLoading(on,text){
 const el=document.querySelector("#loading");if(text)el.textContent=text;el.style.display=on?"flex":"none";
}
async function fetchFeatures(lod){
 if(featureCache[lod])return featureCache[lod];
 if(loading.has(lod))return loading.get(lod);
 const promise=(async()=>{
   if(lod==="10"){
     const r=await fetch("https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_10m_admin_0_countries.geojson",{cache:"force-cache"});
     if(!r.ok)throw new Error("Natural Earth 10m HTTP "+r.status);
     featureCache[lod]=(await r.json()).features;
   }else{
     const r=await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-"+lod+"m.json",{cache:"force-cache"});
     if(!r.ok)throw new Error("World Atlas "+lod+"m HTTP "+r.status);
     const world=await r.json();featureCache[lod]=topojson.feature(world,world.objects.countries).features;
   }
   loading.delete(lod);return featureCache[lod];
 })();
 loading.set(lod,promise);return promise;
}
async function prepareLod(lod,foreground=false){
 if(prepared.has(lod))return;
 if(foreground)setLoading(true,lod==="10"?"Préparation du détail 10m…":"Préparation de la carte…");
 try{
   const features=await fetchFeatures(lod);
   let layer=lodLayers[lod];
   if(!layer){
     layer=lodLayers[lod]=root.insert("g",".gameplay-layer").attr("class","map-layer lod-"+lod).style("display","none");
   }
   layer.selectAll("path.country").data(features,d=>d.id||d.properties?.ADM0_A3||d.properties?.ISO_A3).join("path")
      .attr("class","country").attr("fill",countryFill).attr("d",path);
   prepared.add(lod);
 }catch(e){console.error(e);document.querySelector("#status").textContent="Erreur LOD "+lod+"m";}
 if(foreground)setLoading(false);
}
function showLod(lod){
 Object.entries(lodLayers).forEach(([key,layer])=>layer.style("display",key===lod?null:"none"));
 currentLod=lod;updateStatus();
}
async function ensureLodForScale(k){
 const wanted=lodForScale(k);
 if(wanted===currentLod&&prepared.has(wanted))return;
 if(!prepared.has(wanted))await prepareLod(wanted,true);
 showLod(wanted);
 if(wanted==="110")setTimeout(()=>prepareLod("50"),120);
 if(wanted==="50")setTimeout(()=>prepareLod("10"),220);
}
function drawGameplay(){
 gameplayLayer.selectAll("*").remove();
 const by=Object.fromEntries(cities.map(c=>[c[0],c]));
 routes.forEach(r=>{
   const a=projection([by[r[0]][1],by[r[0]][2]]),b=projection([by[r[1]][1],by[r[1]][2]]);
   const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2-18;
   gameplayLayer.append("path").attr("class","army-route").attr("d",`M${a[0]},${a[1]} Q${mx},${my} ${b[0]},${b[1]}`);
   const t=r[3],u=1-t,px=u*u*a[0]+2*u*t*mx+t*t*b[0],py=u*u*a[1]+2*u*t*my+t*t*b[1];
   gameplayLayer.append("circle").attr("class","army-dot").attr("cx",px).attr("cy",py).attr("r",4.5);
   gameplayLayer.append("text").attr("class","army-label").attr("x",px+7).attr("y",py+4).text(r[2]+"k");
 });
 const c=gameplayLayer.selectAll("g.city").data(cities).enter().append("g").attr("class","city").attr("transform",d=>`translate(${projection([d[1],d[2]])})`);
 c.append("circle").attr("r",4.6).attr("fill","#192631");
 c.append("text").attr("class","city-name").attr("x",7).attr("y",-2).attr("font-size",11).text(d=>d[0]);
 c.append("text").attr("class","city-value").attr("x",7).attr("y",9).attr("font-size",8).text(d=>d[3]+"k");
 gameplayLayer.style("display",showGameplay?null:"none");
 gameplayLayer.selectAll(".city text").style("display",showLabels?null:"none");
}
async function resize(){
 W=innerWidth;H=innerHeight;svg.attr("viewBox",[0,0,W,H]);
 projection=d3.geoNaturalEarth1().fitExtent([[8,70],[W-8,H-100]],{type:"Sphere"});
 path=d3.geoPath(projection);
 prepared.clear();
 Object.values(lodLayers).forEach(l=>l.selectAll("*").remove());
 drawGameplay();
 await prepareLod(currentLod,true);showLod(currentLod);
}
let lodTimer=null;
const zoom=d3.zoom().scaleExtent([1,18]).on("zoom",e=>{
 currentTransform=e.transform;root.attr("transform",e.transform);updateStatus();
 clearTimeout(lodTimer);lodTimer=setTimeout(()=>ensureLodForScale(e.transform.k),90);
});
svg.call(zoom);

document.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{
 currentStyle=b.dataset.style;document.body.className="style-"+currentStyle;
 document.querySelectorAll("[data-style]").forEach(x=>x.classList.toggle("active",x===b));
 Object.values(lodLayers).forEach(layer=>layer.selectAll(".country").attr("fill",countryFill));updateStatus();
});
document.querySelector("#toggleGameplay").onclick=e=>{
 showGameplay=!showGameplay;e.target.classList.toggle("active",showGameplay);e.target.textContent="Unités "+(showGameplay?"✓":"✕");
 gameplayLayer.style("display",showGameplay?null:"none");
};
document.querySelector("#toggleLabels").onclick=e=>{
 showLabels=!showLabels;e.target.classList.toggle("active",showLabels);e.target.textContent="Labels "+(showLabels?"✓":"✕");
 gameplayLayer.selectAll(".city text").style("display",showLabels?null:"none");
};
document.querySelector("#reset").onclick=()=>svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity);
addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(resize,120)});
(async()=>{await resize();await ensureLodForScale(1);})();
</script>
</body>
</html>
