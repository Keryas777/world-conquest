<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>World Conquest — Territory Lab</title>
<style>
:root{
  --ocean:#8fb6c4;--neutral:#c8cdca;--border:#eef4f6;--panel:#101b26e8;--text:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1520;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
#map{width:100%;height:100%;display:block;touch-action:none;background:var(--ocean)}
.country{stroke:none}
.map-layer{opacity:0;pointer-events:none;transition:opacity 240ms ease-in-out;will-change:opacity}
.map-layer.lod-active{opacity:1}
.border-layer{pointer-events:none;opacity:0;transition:opacity 1000ms ease-in-out;will-change:opacity}
.border-layer path{fill:none;stroke:var(--border);stroke-width:.75;vector-effect:non-scaling-stroke}
.border-layer.border-active{opacity:1}
.territory-fill-layer,.territory-internal-layer{pointer-events:none}
.territory-cell{stroke:none}
.territory-internal-layer path{fill:none;stroke:#fff;stroke-width:.55;vector-effect:non-scaling-stroke}
.city-layer{pointer-events:none}
.city-seed{fill:#17222c;stroke:none;stroke-width:0;vector-effect:non-scaling-stroke;pointer-events:none}
.city-hit{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
.city-info{position:fixed;z-index:12;left:14px;right:14px;top:110px;max-width:420px;background:#101b26f2;border:1px solid #ffffff26;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #0006;display:none}
.city-info .close{position:absolute;right:10px;top:7px;font-size:20px;color:#aebbc5;cursor:pointer}
.city-info b{font-size:15px}.city-info .meta{font-size:12px;color:#c9d6df;margin-top:2px}.city-info .neighbors{font-size:12px;line-height:1.45;margin-top:8px;max-height:220px;overflow:auto}
.city-info .foreign{color:#ffcf5a}
.debug-panel{position:fixed;z-index:13;left:14px;right:14px;bottom:180px;max-height:42vh;background:#07111bf2;border:1px solid #ffffff26;border-radius:14px;padding:10px 12px;display:none;box-shadow:0 10px 30px #0007}
.debug-panel pre{margin:0;white-space:pre-wrap;word-break:break-word;font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#c9d6df;max-height:36vh;overflow:auto}
.panel{position:fixed;z-index:10;background:var(--panel);border:1px solid #ffffff26;border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.header{left:12px;right:12px;top:max(10px,env(safe-area-inset-top));padding:10px 12px}
.title{font-weight:900;font-size:15px;letter-spacing:.2px}.sub{font-size:11px;color:#c9d6df;margin-top:2px}
.toolbar{left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));padding:8px;display:grid;gap:7px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
button{border:1px solid #ffffff28;background:#1b2936;color:#eef5f8;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;white-space:nowrap}
button.active{background:#fff;color:#17222c;border-color:#fff}
#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:#0b152088;font-weight:800;text-align:center;padding:30px}
.badge{margin-left:auto;font-size:10px;color:#b8c7d2;padding:7px 2px}
.style-state{--ocean:#d9e0e3;--neutral:#bfc2c3;--border:#fff}
.style-dark{--ocean:#172536;--neutral:#394858;--border:#8fa0ad;--panel:#07111be8}
.style-dark .city text,.style-dark .army-label{stroke:#0b141d}
.style-pastel{--ocean:#a9ccd4;--neutral:#d8d8d1;--border:#f7f7f3}
@media (min-width:800px){.header{left:18px;right:auto;min-width:340px}.toolbar{left:18px;right:auto;width:auto;min-width:520px}}
</style>
</head>
<body class="style-state">
<svg id="map"></svg>
<div class="panel header">
  <div class="title">WORLD CONQUEST · TERRITORY LAB</div>
  <div class="sub" id="status">Monde · 110m · State-like · LOD auto</div>
</div>
<div class="panel toolbar">
  <div class="row">
    <button class="active">LOD auto</button>
    <span class="badge">110m monde → 50m continent → 10m local</span>
  </div>
  <div class="row" id="styles">
    <button data-style="state" class="active">State-like</button>
    <button data-style="pastel">Pastel</button>
    <button data-style="dark">Dark</button>
    <span class="badge">style</span>
  </div>
  <div class="row">
    <button id="toggle-cities" class="active">Villes ✓</button>
    <button id="toggle-debug">Debug</button>
    <button id="reset">Recentrer</button>
  </div>
</div>
<div class="city-info" id="city-info"><div class="close" id="city-info-close">×</div><div id="city-info-content"></div></div>
<div class="debug-panel" id="debug-panel"><pre id="debug-content">Aucune ville sélectionnée.</pre></div>
<div id="loading">Chargement de la carte…</div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
const svg=d3.select("#map");
const mapRoot=svg.append("g").attr("class","map-root");
const fillRoot=mapRoot.append("g").attr("class","fill-root");
const territoryFillRoot=mapRoot.append("g").attr("class","territory-fill-layer");
const territoryInternalRoot=mapRoot.append("g").attr("class","territory-internal-layer");
const borderRoot=mapRoot.append("g").attr("class","border-root");
const cityLinkRoot=mapRoot.append("g").attr("class","city-link-layer");
const cityRoot=mapRoot.append("g").attr("class","city-layer");
const lodLayers={},borderLayers={};
let territoryData=null,citiesVisible=true,debugVisible=false,cityById=new Map(),neighborMap=new Map(),selectedCityId=null;
const territoryColors={};
const territoryPalette=(()=>{
 const colors=[];
 // 24 well-spaced hues × 4 controlled saturation/lightness families = 96 colors.
 // The hue sequence uses a large coprime step so adjacent palette entries are far apart.
 const hueStep=137;
 const families=[
  {s:62,l:55},
  {s:54,l:46},
  {s:70,l:64},
  {s:46,l:58}
 ];
 for(let i=0;i<96;i++){
  const family=families[Math.floor(i/24)];
  const hue=(i%24)*hueStep%360;
  colors.push({css:`hsl(${hue} ${family.s}% ${family.l}%)`,h:hue,s:family.s,l:family.l});
 }
 return colors;
})();
function colorDistance(a,b){
 const dh=Math.min(Math.abs(a.h-b.h),360-Math.abs(a.h-b.h))/180;
 const ds=Math.abs(a.s-b.s)/100;
 const dl=Math.abs(a.l-b.l)/100;
 // Hue dominates; lightness and saturation prevent same-hue variants looking identical.
 return Math.sqrt(2.6*dh*dh+.7*ds*ds+1.3*dl*dl);
}
function buildOwnerColors(){
 if(!territoryData)return;
 for(const key of Object.keys(territoryColors))delete territoryColors[key];
 const owners=[...new Set(territoryData.cells.map(d=>d.ownerCode||d.country))].sort();
 const direct=new Map(owners.map(o=>[o,new Set()]));
 for(const e of (territoryData.edges||[])){
  const a=cityById.get(e.a),b=cityById.get(e.b);if(!a||!b)continue;
  const oa=a.ownerCode||a.country,ob=b.ownerCode||b.country;
  if(oa===ob)continue;
  direct.get(oa)?.add(ob);direct.get(ob)?.add(oa);
 }
 const dist2=new Map();
 for(const o of owners){
  const s=new Set(direct.get(o)||[]);
  for(const n of (direct.get(o)||[]))
   for(const nn of (direct.get(n)||[]))
    if(nn!==o)s.add(nn);
  dist2.set(o,s);
 }

 const assigned=new Map(),usage=new Array(territoryPalette.length).fill(0),uncolored=new Set(owners);
 while(uncolored.size){
  let best=null,bestSat=-1,bestDeg=-1;
  for(const o of uncolored){
   const used=new Set([...dist2.get(o)].map(n=>assigned.get(n)).filter(v=>v!==undefined));
   const sat=used.size,deg=dist2.get(o).size;
   if(sat>bestSat||(sat===bestSat&&(deg>bestDeg||(deg===bestDeg&&(best===null||o<best))))){
    best=o;bestSat=sat;bestDeg=deg;
   }
  }

  const nearAssigned=[...dist2.get(best)].map(n=>assigned.get(n)).filter(v=>v!==undefined);
  const forbidden=new Set(nearAssigned);
  let bestIdx=-1,bestScore=-Infinity;

  for(let i=0;i<territoryPalette.length;i++){
   if(forbidden.has(i))continue;
   let minDistance=2;
   for(const otherIdx of nearAssigned)
    minDistance=Math.min(minDistance,colorDistance(territoryPalette[i],territoryPalette[otherIdx]));
   // First maximize perceptual distance from countries up to two borders away.
   // A small usage penalty spreads reuse across the whole world.
   const score=minDistance-usage[i]*0.025;
   if(score>bestScore){bestScore=score;bestIdx=i}
  }

  if(bestIdx<0){
   // Extremely defensive fallback: choose the least conflicting / least used color.
   let bestConf=Infinity;
   for(let i=0;i<territoryPalette.length;i++){
    let conf=0;for(const n of dist2.get(best))if(assigned.get(n)===i)conf++;
    const weighted=conf*100+usage[i];
    if(weighted<bestConf){bestConf=weighted;bestIdx=i}
   }
  }

  assigned.set(best,bestIdx);usage[bestIdx]++;uncolored.delete(best);
 }
 for(const [o,i] of assigned)territoryColors[o]=territoryPalette[i].css;
}
let W,H,projection,path,currentLod="110",currentStyle="state",currentTransform=d3.zoomIdentity;
const featureCache={}, prepared=new Set(), loading=new Map();

const LOD_UP_110_TO_50=5.5;
const LOD_UP_50_TO_10=40.0;
const LOD_DOWN_10_TO_50=39.5;
const LOD_DOWN_50_TO_110=5.4;

function lodForScale(k){
 if(currentLod==="110") return k>=LOD_UP_110_TO_50?"50":"110";
 if(currentLod==="50"){
   if(k<LOD_DOWN_50_TO_110)return "110";
   if(k>=LOD_UP_50_TO_10)return "10";
   return "50";
 }
 if(k<LOD_DOWN_10_TO_50)return "50";
 return "10";
}
function viewName(){return currentLod==="110"?"Monde":currentLod==="50"?"Continent":"Régional"}
function countryFill(){
 return getComputedStyle(document.body).getPropertyValue("--neutral").trim()||"#bfc2c3";
}
function updateStatus(){
 const t=territoryData?" · "+territoryData.cells.length+" cellules":"";
 document.querySelector("#status").textContent=viewName()+" · "+currentLod+"m · "+({"state":"State-like","pastel":"Pastel","dark":"Dark"})[currentStyle]+" · Zoom ×"+currentTransform.k.toFixed(2)+t;
}
function setLoading(on,text){
 const el=document.querySelector("#loading");if(text)el.textContent=text;el.style.display=on?"flex":"none";
}
async function fetchFeatures(lod){
 if(featureCache[lod])return featureCache[lod];
 if(loading.has(lod))return loading.get(lod);
 const promise=(async()=>{
   if(lod==="10"){
     const r=await fetch("https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@master/geojson/ne_10m_admin_0_countries.geojson",{cache:"force-cache"});
     if(!r.ok)throw new Error("Natural Earth 10m HTTP "+r.status);
     featureCache[lod]=(await r.json()).features;
   }else{
     const r=await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-"+lod+"m.json",{cache:"force-cache"});
     if(!r.ok)throw new Error("World Atlas "+lod+"m HTTP "+r.status);
     const world=await r.json();featureCache[lod]=topojson.feature(world,world.objects.countries).features;
   }
   loading.delete(lod);return featureCache[lod];
 })();
 loading.set(lod,promise);return promise;
}
async function prepareLod(lod,foreground=false){
 if(prepared.has(lod))return;
 if(foreground)setLoading(true,lod==="10"?"Préparation du détail 10m…":"Préparation de la carte…");
 try{
   const features=await fetchFeatures(lod);
   let layer=lodLayers[lod];
   if(!layer){
     layer=lodLayers[lod]=fillRoot.append("g").attr("class","map-layer lod-"+lod);
   }
   layer.selectAll("path.country").data(features,d=>d.id||d.properties?.ADM0_A3||d.properties?.ISO_A3).join("path")
      .attr("class","country").attr("fill",countryFill).attr("d",path);

   // Frontières indépendantes des aplats : elles ne participent pas au crossfade.
   let borders=borderLayers[lod];
   if(!borders)borders=borderLayers[lod]=borderRoot.append("g").attr("class","border-layer border-"+lod);
   borders.selectAll("path").data(features,d=>d.id||d.properties?.ADM0_A3||d.properties?.ISO_A3).join("path").attr("d",path);
   prepared.add(lod);
 }catch(e){console.error(e);document.querySelector("#status").textContent="Erreur LOD "+lod+"m";}
 if(foreground)setLoading(false);
}
let lodTransitionTimer=null;
function showLod(lod){
 const next=lodLayers[lod], nextBorders=borderLayers[lod];
 if(!next||!nextBorders)return;
 clearTimeout(lodTransitionTimer);

 const oldLod=currentLod;
 const old=lodLayers[oldLod];
 const oldBorders=borderLayers[oldLod];

 // Important : l'ancien aplat reste 100 % opaque pendant que le nouveau
 // apparaît par-dessus. Deux couches semi-transparentes simultanées
 // laissaient transparaître l'océan/fond et provoquaient le flash des terres.
 if(old)old.classed("lod-active",true);
 if(oldBorders)oldBorders.classed("border-active",true);

 next.classed("lod-active",true);

 lodTransitionTimer=setTimeout(()=>{
   // Une fois le nouveau LOD totalement opaque, l'ancien peut être retiré
   // sans modifier la luminosité des terres.
   Object.entries(lodLayers).forEach(([key,layer])=>{
     if(key!==lod)layer.classed("lod-active",false);
   });
   Object.entries(borderLayers).forEach(([key,layer])=>layer.classed("border-active",key===lod));
 },150);

 currentLod=lod;updateStatus();
}
async function ensureLodForScale(k){
 const wanted=lodForScale(k);
 // Précharge le prochain niveau même si aucun changement n'est requis.
 if(wanted==="110"&&!prepared.has("50"))setTimeout(()=>prepareLod("50"),80);
 if(wanted==="50"&&!prepared.has("10"))setTimeout(()=>prepareLod("10"),180);

 if(wanted===currentLod&&prepared.has(wanted))return;
 if(!prepared.has(wanted))await prepareLod(wanted,true);
 showLod(wanted);
}
function territoryInternalOpacity(k){if(k<40)return 0;if(k<45)return .08*((k-40)/5);if(k<60)return .08+.42*((k-45)/15);if(k<80)return .50+.35*((k-60)/20);return .85}
function cityScreenRadius(k){
 if(k<10)return 0;
 if(k<35)return 1+4*((k-10)/25);
 if(k<40)return 5;
 if(k<60)return 5+2*((k-40)/20);
 if(k<100)return 7+4*((k-60)/40);
 if(k<160)return 11+3*((k-100)/60);
 return Math.min(16,14+2*((k-160)/40));
}
function updateTerritoryStyle(){
 territoryInternalRoot.attr("opacity",territoryInternalOpacity(currentTransform.k));
 const visible=citiesVisible&&currentTransform.k>=10;
 cityRoot.attr("display",visible?null:"none");
 cityLinkRoot.attr("display",visible?null:"none");
 const screenRadius=cityScreenRadius(currentTransform.k);
 cityRoot.selectAll("circle.city-seed")
  .attr("r",screenRadius/currentTransform.k)
  .style("stroke",screenRadius>=5?"#fff":"none")
  .style("stroke-width",screenRadius>=5?"1px":"0px");
 cityRoot.selectAll("circle.city-hit").attr("r",Math.max(10,screenRadius+4)/currentTransform.k);
 cityLinkRoot.selectAll("line").attr("stroke-width",2/currentTransform.k);
}
function drawTerritories(){if(!territoryData||!path)return;
 cityById=new Map(territoryData.cells.map(d=>[d.id,d]));
 neighborMap=new Map(territoryData.cells.map(d=>[d.id,[]]));
 buildOwnerColors();
 territoryFillRoot.selectAll("path.territory-cell").data(territoryData.cells,d=>d.id).join("path").attr("class","territory-cell").attr("fill",d=>territoryColors[d.ownerCode||d.country]||"#9aa0a6").attr("d",d=>d.geometry?path(d.geometry):null);territoryInternalRoot.selectAll("path").data(territoryData.cells,d=>d.id).join("path").attr("d",d=>d.geometry?path(d.geometry):null);
 for(const e of (territoryData.edges||[])){
  if(neighborMap.has(e.a))neighborMap.get(e.a).push({...e,other:e.b});
  if(neighborMap.has(e.b))neighborMap.get(e.b).push({...e,other:e.a});
 }
 cityRoot.selectAll("circle.city-seed").data(territoryData.cells,d=>d.id).join("circle")
  .attr("class","city-seed")
  .attr("cx",d=>projection([d.lon,d.lat])[0])
  .attr("cy",d=>projection([d.lon,d.lat])[1]);
 cityRoot.selectAll("circle.city-hit").data(territoryData.cells,d=>d.id).join("circle")
  .attr("class","city-hit")
  .attr("cx",d=>projection([d.lon,d.lat])[0])
  .attr("cy",d=>projection([d.lon,d.lat])[1])
  .on("click",(event,d)=>{event.stopPropagation();showCityInfo(d);});
 updateTerritoryStyle()}
function updateDebugPanel(){
 const pre=document.querySelector("#debug-content");
 if(!pre)return;
 if(!selectedCityId){
  pre.textContent=[
   "Territory Lab debug",
   "zoom="+currentTransform.k.toFixed(2),
   "lod="+currentLod+"m",
   "cells="+(territoryData?.cells?.length??0),
   "edges="+(territoryData?.edges?.length??0),
   "",
   "Aucune ville sélectionnée."
  ].join("\n");
  return;
 }
 const city=cityById.get(selectedCityId);
 if(!city){pre.textContent="Ville sélectionnée introuvable.";return;}
 const list=(neighborMap.get(city.id)||[]).slice().sort((a,b)=>a.km-b.km);
 const foreign=list.filter(e=>e.foreign);
 const areaKm2=city.geometry?d3.geoArea(city.geometry)*6371.0088*6371.0088:0;
 const lines=[
  "Territory Lab debug",
  "zoom="+currentTransform.k.toFixed(2)+" | lod="+currentLod+"m",
  "",
  "cityId="+city.id,
  "name="+city.name+" | country="+city.country,
  "lat="+city.lat+" | lon="+city.lon,
  "population="+city.population,
  "geometry="+(city.geometry?.type??"null"),
  "area≈"+areaKm2.toFixed(1)+" km²",
  "neighbors="+list.length+" | foreign="+foreign.length,
  ""
 ];
 for(const e of list){
  const o=cityById.get(e.other);
  lines.push((e.foreign?"FOREIGN ":"INTERNAL")+" -> "+(o?.name??e.other)+" ["+e.other+"] "+e.km+" km");
 }
 pre.textContent=lines.join("\n");
}
function showCityInfo(city){
 selectedCityId=city.id;
 updateDebugPanel();
 const list=(neighborMap.get(city.id)||[]).slice().sort((a,b)=>a.km-b.km);
 const foreign=list.filter(e=>e.foreign);
 const rows=list.map(e=>{
  const o=cityById.get(e.other);
  if(!o)return "";
  return '<div class="'+(e.foreign?'foreign':'')+'">'+o.name+' ('+o.country+') — '+e.km+' km</div>';
 }).join("");
 document.querySelector("#city-info-content").innerHTML=
  '<b>'+city.name+' ('+city.country+')</b>'+
  '<div class="meta">'+Number(city.population).toLocaleString("fr-FR")+' hab.</div>'+
  '<div class="meta"><b>'+list.length+'</b> voisin(s) terrestre(s), <b>'+foreign.length+'</b> étranger(s)</div>'+
  '<div class="neighbors">'+rows+'</div>';
 document.querySelector("#city-info").style.display="block";
 cityLinkRoot.selectAll("*").remove();
 for(const e of list){
  const o=cityById.get(e.other);if(!o)continue;
  const a=projection([city.lon,city.lat]),b=projection([o.lon,o.lat]);
  cityLinkRoot.append("line")
   .attr("x1",a[0]).attr("y1",a[1]).attr("x2",b[0]).attr("y2",b[1])
   .attr("stroke",e.foreign?"#ffcf5a":"#9ca3af").attr("opacity",.9);
 }
 updateTerritoryStyle();
}
function closeCityInfo(){
 selectedCityId=null;
 updateDebugPanel();
 document.querySelector("#city-info").style.display="none";
 cityLinkRoot.selectAll("*").remove();
}
document.querySelector("#city-info-close").onclick=closeCityInfo;
async function loadTerritories(){try{const r=await fetch("voronoi-graph.json",{cache:"no-cache"});if(!r.ok)throw new Error("voronoi-graph HTTP "+r.status);territoryData=await r.json();drawTerritories();updateStatus()}catch(e){console.error(e);document.querySelector("#status").textContent="Erreur couche territoriale"}}
async function resize(){
 W=innerWidth;H=innerHeight;svg.attr("viewBox",[0,0,W,H]);
 projection=d3.geoNaturalEarth1().fitExtent([[8,70],[W-8,H-100]],{type:"Sphere"});
 path=d3.geoPath(projection);
 drawTerritories();
 prepared.clear();
 Object.values(lodLayers).forEach(l=>l.selectAll("*").remove());
 Object.values(borderLayers).forEach(l=>l.selectAll("*").remove());
 await prepareLod(currentLod,true);showLod(currentLod); borderLayers[currentLod]?.classed("border-active",true);
}
let lodTimer=null;
const zoom=d3.zoom().scaleExtent([1,200]).on("zoom",e=>{
 currentTransform=e.transform;mapRoot.attr("transform",e.transform);updateTerritoryStyle();updateStatus();if(debugVisible)updateDebugPanel();
 clearTimeout(lodTimer);lodTimer=setTimeout(()=>ensureLodForScale(e.transform.k),90);
});
svg.call(zoom);

document.querySelector("#toggle-debug").onclick=()=>{
 debugVisible=!debugVisible;
 const b=document.querySelector("#toggle-debug");
 b.classList.toggle("active",debugVisible);
 b.textContent=debugVisible?"Debug ✓":"Debug";
 document.querySelector("#debug-panel").style.display=debugVisible?"block":"none";
 updateDebugPanel();
};
document.querySelector("#toggle-cities").onclick=()=>{
 citiesVisible=!citiesVisible;
 const b=document.querySelector("#toggle-cities");
 b.classList.toggle("active",citiesVisible);
 b.textContent=citiesVisible?"Villes ✓":"Villes";
 updateTerritoryStyle();
};
document.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{
 currentStyle=b.dataset.style;document.body.className="style-"+currentStyle;
 document.querySelectorAll("[data-style]").forEach(x=>x.classList.toggle("active",x===b));
 Object.values(lodLayers).forEach(layer=>layer.selectAll(".country").attr("fill",countryFill));updateStatus();
});
document.querySelector("#reset").onclick=()=>svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity);
addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(resize,120)});
(async()=>{await resize();await loadTerritories();await ensureLodForScale(1);})();
</script>
</body>
</html>
